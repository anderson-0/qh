# Release builds: `goreleaser release --snapshot --clean` builds everything
# locally without publishing; the release workflow publishes on a v* tag.
version: 2
project_name: qh

builds:
  - id: qh
    main: ./cmd/qh
    binary: qh
    env:
      - CGO_ENABLED=0 # the SQLite driver is pure Go, so every build is static
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md: the workflow passes --release-notes,
# which replaces the generated changelog. (changelog.disable would drop the
# notes too, which left v1.0.0 with an empty body.)

dockers_v2:
  - id: qh
    ids: [qh]
    dockerfile: Dockerfile
    images:
      - ghcr.io/anderson-0/qh
    # A prerelease (v1.1.0-rc1) gets only its own tag; empty tags are dropped.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: qh
      org.opencontainers.image.description: Token-efficient database server for AI agents
      org.opencontainers.image.source: https://github.com/anderson-0/qh
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
      # The MCP registry checks that this image belongs to the server it lists.
      io.modelcontextprotocol.server.name: io.github.anderson-0/qh

# `brew install anderson-0/tap/qh`, on macOS. The release workflow pushes the
# cask to anderson-0/homebrew-tap with a deploy key (HOMEBREW_TAP_DEPLOY_KEY);
# a prerelease is not pushed.
homebrew_casks:
  - name: qh
    ids: [default]
    repository:
      owner: anderson-0
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:anderson-0/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}' # empty in snapshot builds
    directory: Casks
    homepage: https://github.com/anderson-0/qh
    description: Token-efficient database server for AI agents (MCP)
    license: MIT
    skip_upload: auto
    commit_author:
      name: Anderson
      email: anderson.consultant.it@outlook.com
    commit_msg_template: "qh {{ .Tag }}"
    # The binaries are not notarized, so macOS would quarantine qh and refuse
    # to run it. Homebrew warns that `postflight` is deprecated; GoReleaser's
    # replacement (hooks.post.install_steps, for postflight_steps) is not in a
    # release yet (2.18.3). Switch when it is.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qh"]
          end

release:
  github:
    owner: anderson-0
    name: qh
  prerelease: auto
